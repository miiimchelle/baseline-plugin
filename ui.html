<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; margin: 16px; }

    h1 { font-size: 14px; margin: 0 0 8px; }
    .tagline { color: #666; margin-bottom: 12px; }

    select, button { width: 100%; height: 32px; margin-top: 8px; }
    textarea { width: 100%; height: 90px; resize: vertical; margin-top: 10px; }

    .label { font-size: 11px; color: #666; margin-top: 12px; margin-bottom: 4px; }
    .helper { font-size: 11px; color: #888; margin-bottom: 6px; }

    .error { color: #b00020; margin-top: 8px; }

    .list { margin-top: 12px; max-height: 320px; overflow: auto; border-top: 1px solid #eee; padding-top: 12px; }

    .item { padding: 10px 8px; border-bottom: 1px solid #eee; border-radius: 8px; cursor: default; }
    .item.clickable { cursor: pointer; }
    .item.clickable:hover { background: #f7f7f7; }

    .meta { color: #666; font-size: 11px; margin-bottom: 4px; }
    .pill { display: inline-block; padding: 2px 6px; border: 1px solid #ddd; border-radius: 999px; font-size: 11px; margin-right: 6px; }
    .linked { margin-top: 2px; font-size: 11px; color: #888; }

    .actions { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn {
      height: 26px;
      padding: 0 10px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      width: auto;
    }
    .action-btn:hover { background: #f7f7f7; }

    .md { width: 100%; height: 140px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <h1>Baseline</h1>
  <div class="tagline">Capture design decisions, assumptions, trade-offs, and feedback directly in Figma.</div>

  <div class="label">Entry type</div>
  <div class="helper">What kind of thinking are you capturing?</div>
  <select id="type">
    <option value="decision">Decision</option>
    <option value="assumption">Assumption</option>
    <option value="tradeoff">Trade-off</option>
    <option value="feedback">Feedback outcome</option>
    <option value="debt">Design debt</option>
  </select>

  <div class="label">Decision note</div>
  <div class="helper">Capture the why, trade-offs, or context behind this decision.</div>
  <textarea id="note" placeholder="e.g. We chose X over Y because…"></textarea>

  <button id="save">Save entry</button>
  <button id="cancelEdit" style="display:none;">Cancel edit</button>

  <button id="export">Export Markdown</button>

  <div id="error" class="error"></div>

  <textarea id="md" class="md" readonly></textarea>

  <div class="list" id="list"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let editingId = null;

    function setError(msg) {
      $("error").textContent = msg || "";
      requestResize();
    }

    // Option B: auto-resize based on content height
    function requestResize() {
      const padding = 24;
      const maxHeight = 720;
      const minHeight = 460;

      const height = Math.min(
        maxHeight,
        Math.max(minHeight, document.body.scrollHeight + padding)
      );

      parent.postMessage(
        { pluginMessage: { type: "RESIZE", width: 360, height } },
        "*"
      );
    }

    function enterEditMode(entry) {
      editingId = entry.id;
      $("type").value = entry.type;
      $("note").value = entry.note;
      $("save").textContent = "Update entry";
      $("cancelEdit").style.display = "block";
      $("note").focus();
      requestResize();
    }

    function exitEditMode() {
      editingId = null;
      $("save").textContent = "Save entry";
      $("cancelEdit").style.display = "none";
      requestResize();
    }

    function render(entries) {
      const list = $("list");
      list.innerHTML = "";

      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "meta";
        empty.textContent = "No entries yet.";
        list.appendChild(empty);
        requestResize();
        return;
      }

      for (const e of entries) {
        const clickable = !!e.nodeId;

        const item = document.createElement("div");
        item.className = "item" + (clickable ? " clickable" : "");
        item.onclick = () => {
          if (!e.nodeId) return;
          parent.postMessage(
            { pluginMessage: { type: "GO_TO_ENTRY", nodeId: e.nodeId } },
            "*"
          );
        };

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `<span class="pill">${e.type}</span> ${new Date(e.createdAt).toLocaleString()}${e.updatedAt ? " (edited)" : ""}`;

        const linked = document.createElement("div");
        linked.className = "linked";
        linked.textContent =
          e.pageName && e.nodeName
            ? `Linked to: ${e.pageName} → ${e.nodeName}`
            : e.pageName
            ? `Linked to: ${e.pageName}`
            : `Linked to: (not linked)`;

        const note = document.createElement("div");
        note.textContent = e.note;

        const actions = document.createElement("div");
        actions.className = "actions";

        const editBtn = document.createElement("button");
        editBtn.className = "action-btn";
        editBtn.textContent = "Edit";
        editBtn.onclick = (ev) => {
          ev.stopPropagation();
          setError("");
          enterEditMode(e);
        };

        const delBtn = document.createElement("button");
        delBtn.className = "action-btn";
        delBtn.textContent = "Delete";
        delBtn.onclick = (ev) => {
          ev.stopPropagation();
          setError("");
          const ok = confirm("Delete this entry?");
          if (!ok) return;
          parent.postMessage({ pluginMessage: { type: "DELETE_ENTRY", id: e.id } }, "*");
        };

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        item.appendChild(meta);
        item.appendChild(linked);
        item.appendChild(note);
        item.appendChild(actions);
        list.appendChild(item);
      }

      requestResize();
    }

    $("cancelEdit").onclick = () => {
      exitEditMode();
      $("note").value = "";
      setError("");
    };

    $("save").onclick = () => {
      setError("");

      const payload = {
        entryType: $("type").value,
        note: $("note").value
      };

      parent.postMessage(
        {
          pluginMessage: editingId
            ? { type: "UPDATE_ENTRY", id: editingId, ...payload }
            : { type: "ADD_ENTRY", ...payload }
        },
        "*"
      );
    };

    $("export").onclick = () => {
      setError("");
      parent.postMessage({ pluginMessage: { type: "EXPORT_MD" } }, "*");
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "ERROR") {
        setError(msg.message);
        return;
      }

      if (msg.type === "JOURNAL") {
        exitEditMode();
        $("note").value = "";
        $("md").style.display = "none";
        render(msg.entries);
        return;
      }

      if (msg.type === "EXPORT_MD_RESULT") {
        $("md").value = msg.markdown;
        $("md").style.display = "block";
        requestResize();
        return;
      }
    };

    window.onload = () => {
      requestResize();
      parent.postMessage({ pluginMessage: { type: "GET_JOURNAL" } }, "*");
    };
  </script>
</body>
</html>
